<div id="translationContainer" style="display: none">
	<div id="languageSelectionDisplay">
		<button type="button" id="speechRecognitionLanguageDisplay" class="iconButton" aria-haspopup="dialog"><span class="languageDisplayName"></span><span class="buttonLabel">Translate from</span></button>
		<button id="switchLanguageButton" class="iconButton"><span class="icon switchIcon" aria-hidden="true"></span><span class="buttonLabel">Switch</span></button>
		<button type="button" id="targetLanguageDisplay" class="iconButton" aria-haspopup="dialog"><span class="languageDisplayName"></span><span class="buttonLabel">Translate to</span></button>
	</div>
	<div id="translationDisplayContainer">
		<div id="resultsContainer">
			<div class="translationTextContainer" id="detected"></div>
			<div id="separator"></div>
			<div class="translationTextContainer" id="translated" aria-live="polite" aria-atomic="true"></div>
		</div>
	</div>
	<div id="controlsDivider" aria-hidden="true"></div>
	<div id="controlsContainer">
		<button id="homeButton" class="iconButton" aria-keyshortcuts="Escape"><span class="icon backIcon" aria-hidden="true"></span><span class="buttonLabel">Back</span></button>
		<div id="startStopButtonContainer">
			<button id="startButton" class="iconButton" aria-keyshortcuts="s"><span class="icon microphoneIcon" aria-hidden="true"></span><span class="buttonLabel">Start translating</span></button>
			<button id="stopButton" class="iconButton" hidden aria-keyshortcuts="s"><span class="icon microphoneMutedIcon" aria-hidden="true"></span><span class="buttonLabel">Stop translating</span></button>
		</div>
		<div id="endControls">
			<button id="translateViewSettingsButton" class="iconButton"><span class="icon settingsIcon" aria-hidden="true"></span><span class="buttonLabel">Settings</span></button>
			<div id="fullscreenButtonContainer">
				<button id="enterFullscreenButton" class="iconButton"><span class="icon fullscreenIcon" aria-hidden="true"></span><span class="buttonLabel">Enter fullscreen</span></button>
				<button id="exitFullscreenButton" class="iconButton" hidden><span class="icon fullscreenExitIcon" aria-hidden="true"></span><span class="buttonLabel">Exit fullscreen</span></button>
			</div>
			<div id="chromeButtonContainer">
				<button id="hideChromeButton" class="iconButton"><span class="icon chromeHideIcon" aria-hidden="true"></span><span class="buttonLabel">Hide controls</span></button>
				<button id="showChromeButton" class="iconButton" hidden aria-keyshortcuts="Escape"><span class="icon chromeShowIcon" aria-hidden="true"></span><span class="buttonLabel">Show controls</span></button>
			</div>
		</div>
	</div>
</div>
