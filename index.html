<html lang="en">
<head>
    <title>Live</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link href="style.css" rel="stylesheet" type="text/css">
    <link href="intro.css" rel="stylesheet" type="text/css">
    <link href="settings.css" rel="stylesheet" type="text/css">
    <link href="sign-up.css" rel="stylesheet" type="text/css">
    <link href="translation.css" rel="stylesheet" type="text/css">
</head>
<body>
	<div id="contentContainer">
		<div id="introContainer">
			<div id="introTextContainer">
				<div class="introText" id="helloText">Layho</div>
				<div class="introText" id="signInOutContainer">
					<div id="nameText"></div>
					<div id="signInButtonHost" hidden>
						<button type="button" id="signInButton" class="googleRedirectButton" aria-label="Sign in with Google">
							<svg class="googleLogo" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
								<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
								<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
								<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
								<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
							</svg>
							<span>Sign in with Google</span>
						</button>
						<div id="googleGisButton"></div>
					</div>
				</div>
				<div class="introText" id="introButtonContainer">	
					<div id="signUpOutButtonContainer">
						<button id="signUpButton" class="iconButton"><span class="icon signUpIcon" aria-hidden="true"></span><span class="buttonLabel">Sign up</span></button>
						<button id="signOutButton" class="iconButton" hidden><span class="icon signOutIcon" aria-hidden="true"></span><span class="buttonLabel">Sign out</span></button>
					</div>
					<button id="settingsButton" class="iconButton" disabled><span class="icon settingsIcon" aria-hidden="true"></span><span class="buttonLabel">Sign in for settings</span></button>
					<button id="startAppButton" class="iconButton" disabled><span class="icon startIcon" aria-hidden="true"></span><span class="buttonLabel">Sign in to start</span></button>
				</div>
			</div>
		</div>
		<div id="speechStatus" class="visuallyHidden" role="status" aria-live="polite" aria-atomic="true"></div>
		<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
	</div>
	<!-- Speech SDK REFERENCE -->
	<script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>

	<script src="./LoadViews.js"></script>
	<script src="./Settings.js"></script>
	<script src="./SignUp.js"></script>
	<script src="./index.js"></script>
	<script src="./Translation.js"></script>
	<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn()"></script>
</body>
</html>
