<div id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsHeader" aria-hidden="true" style="display: none">
	<div id="settingsContainer">
		<div id="settingsContentContainer">
			<h1 id="settingsHeader">Settings</h1>
			<form id="settingsForm">
				<div id="settingsList">
					<div class="setting">
						<h2 class="settingTitle">Language</h2>
						<div class="settingOption">
							<label for="speechRecognitionLanguageOptions" class="settingOptionLabel">Translate from:</label>
							<select id="speechRecognitionLanguageOptions"></select>
						</div>
						<div class="settingOption">
							<label for="targetLanguageOptions" class="settingOptionLabel">Translate to:</label>
							<select id="targetLanguageOptions"></select>
						</div>
					</div>
					<div class="setting">
						<h2 class="settingTitle">Output</h2>
						<div class="settingOption">
							<label id="voiceOutputLabel" for="voiceOutputInput" class="settingOptionLabel">Voice</label>
							<label class="switch">
								<input id="voiceOutputInput" type="checkbox" aria-labelledby="voiceOutputLabel" aria-describedby="exclusiveModeHint">
								<span class="slider" aria-hidden="true"></span>
							</label>
						</div>
					</div>
					<div class="setting">
						<h2 class="settingTitle">Mode</h2>
						<div class="settingOption">
							<label id="conversationModeLabel" for="conversationModeInput" class="settingOptionLabel">Conversation</label>
							<label class="switch">
								<input id="conversationModeInput" type="checkbox" aria-labelledby="conversationModeLabel" aria-describedby="exclusiveModeHint">
								<span class="slider" aria-hidden="true"></span>
							</label>
						</div>
					</div>
					<div class="setting settingsLegalLinks">
						<a id="privacyPolicyLink" class="settingsPrivacyLink" href="privacy.html" target="_blank" rel="noopener noreferrer"><span class="settingsPrivacyLinkText">Privacy Policy</span><span class="icon openInNewIcon" aria-hidden="true"></span><span class="visuallyHidden">(opens in a new tab)</span></a>
						<a id="termsOfServiceLink" class="settingsPrivacyLink" href="terms.html" target="_blank" rel="noopener noreferrer"><span class="settingsPrivacyLinkText">Terms of Service</span><span class="icon openInNewIcon" aria-hidden="true"></span><span class="visuallyHidden">(opens in a new tab)</span></a>
					</div>
				</div>
				<button id="settingsSubmitButton" class="iconButton" type="submit"><span class="icon submitIcon" aria-hidden="true"></span><span class="buttonLabel">Submit</span></button>
			</form>
		</div>
	</div>
	<div id="settingsScrollHint">
		<button type="button" id="settingsScrollHintButton" disabled>
			<span class="settingsScrollChevron" aria-hidden="true"></span>
			<span class="visuallyHidden">Scroll down</span>
		</button>
	</div>
	<button id="settingsCloseButton" class="settingsCloseButton iconButton iconOnlyButton"><span class="icon backIcon" aria-hidden="true"></span><span class="buttonLabel">Back</span></button>
</div>
